
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your matched jobs</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f6f3; --surface: #fff; --ink: #17282b; --muted: #5a6b6e; --line: #d3dcd8;
    --accent: #1b6b57; --mid: #8a6a00; --low: #5a6b6e;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #101a1c; --surface: #16252a; --ink: #e6efec; --muted: #96a8a8; --line: #2a3d41; --accent: #5cc5a6; --mid: #e0b93c; --low: #96a8a8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--body); }
  .wrap { max-width: 56rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font: 700 clamp(2rem, 6vw, 3.25rem)/1.05 var(--display); letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; }
  .nav a { color: var(--accent); font-weight: 500; margin-right: 1.25rem; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .how { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 4px; padding: 0.9rem 1rem; margin: 1.25rem 0; }
  .how summary { font: 700 1.05rem var(--display); cursor: pointer; }
  .how ol { margin: 0.8rem 0 0; padding-left: 1.3rem; }
  .how li { margin-bottom: 0.4rem; }

  .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.75rem; margin: 0 0 1.25rem; }
  .controls label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.2rem; }
  .controls input[type=search], .controls select { width: 100%; font: 400 0.95rem var(--body); padding: 0.55rem 0.6rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
  .controls input[type=range] { width: 100%; accent-color: var(--accent); }

  #count { color: var(--muted); margin: 0 0 0.5rem; }
  #list { border-top: 2px solid var(--ink); }
  .job { display: grid; grid-template-columns: 4.5rem 1fr; gap: 1rem; padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
  .score { text-align: center; }
  .score b { display: block; font: 700 2rem/1 var(--display); }
  .score span { font-size: 0.78rem; font-weight: 600; }
  .strong b, .strong span { color: var(--accent); }
  .partial b, .partial span { color: var(--mid); }
  .weak b, .weak span { color: var(--low); }
  .job h2 { font: 700 1.2rem/1.25 var(--display); margin: 0; }
  .job h2 a { color: inherit; text-decoration: none; }
  .job h2 a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .meta { color: var(--muted); font-size: 0.95rem; margin: 0.2rem 0 0; }
  .meta strong { color: var(--ink); font-weight: 600; }
  .reason { margin: 0.5rem 0 0; max-width: 68ch; }
  .tag { display: inline-block; margin: 0.4rem 0.4rem 0 0; padding: 0.05rem 0.5rem; border: 1px solid var(--line); border-radius: 999px; font-size: 0.78rem; color: var(--muted); }
  .note { padding: 2rem 0; color: var(--muted); }
  @media (max-width: 40rem) { .controls { grid-template-columns: 1fr; } .job { grid-template-columns: 3.5rem 1fr; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>Your matched jobs</h1>
  <p class="sub" id="when"></p>
  <p class="nav"><a href="profile.html">Change my priorities</a><a href="job-recommendations.html">Browse all jobs</a></p>

  <details class="how" id="how" open hidden>
    <summary>How these were matched</summary>
    <ol id="steps"></ol>
  </details>

  <div class="controls">
    <div><label for="q">Search these results</label><input id="q" type="search" placeholder="Title, company, or reason"></div>
    <div><label for="min">Minimum score: <output id="minOut">50</output></label><input id="min" type="range" min="0" max="100" step="5" value="50"></div>
    <div><label for="sort">Sort by</label>
      <select id="sort"><option value="score">Best match</option><option value="miles">Closest</option><option value="posted">Newest</option></select></div>
  </div>

  <p id="count" aria-live="polite"></p>
  <div id="list"></div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var data = null;
  var LABELS = { location: "Location", salary: "Salary", experience: "Fits my experience level", jobtype: "Type of job", company: "Company I want to work for", growth: "Room to grow" };

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function band(s) { return s >= 70 ? ["strong", s >= 90 ? "Excellent" : "Strong"] : s >= 50 ? ["partial", "Partial"] : ["weak", "Weak"]; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }

  fetch("matched-jobs.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { data = d; start(); })
    .catch(function () {
      $("list").appendChild(el("p", "note", "Couldn't load matched-jobs.json. Run jobmatcher.py and put the file in the same folder as this page."));
    });

  function start() {
    var s = data.stats, p = data.profile || {};
    $("when").textContent = "Updated " + new Date(data.generated).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    var steps = $("steps");
    steps.appendChild(el("li", "", "Collected " + s.in_csv + " job listings from the sources we search."));
    if (s.hidden_by_distance || p.miles) {
      var t = s.hidden_by_distance + " were hidden because they're farther than " + (p.miles || 50) + " miles from home" +
        ((p.arrangement || []).indexOf("Remote") > -1 ? " (remote jobs stay)." : ".");
      if (s.hidden_dream_company) t += " " + s.hidden_dream_company + " of those were at your dream companies.";
      steps.appendChild(el("li", "", t));
    }
    steps.appendChild(el("li", "", "The " + s.sent_to_claude + " listings closest to your roles, field, and dream companies went to an AI model for scoring."));
    var pr = (p.priorities || []).map(function (k, i) { return (i + 1) + ". " + (LABELS[k] || k); }).join("  ");
    steps.appendChild(el("li", "", "Each was scored 0 to 100 against your profile, giving more weight to what you ranked highest" + (pr ? " (" + pr + ")." : ".")));
    $("how").hidden = false;
    render();
  }

  function render() {
    var q = $("q").value.toLowerCase().trim(), min = +$("min").value, sort = $("sort").value;
    var rows = data.jobs.filter(function (j) {
      return j.score >= min && (!q || [j.title, j.company, j.reason].join(" ").toLowerCase().indexOf(q) > -1);
    });
    rows.sort(function (a, b) {
      if (sort === "miles") return (a.miles == null) - (b.miles == null) || a.miles - b.miles;
      if (sort === "posted") return (Date.parse(b.posted) || 0) - (Date.parse(a.posted) || 0);
      return b.score - a.score;
    });
    $("count").textContent = rows.length + " of " + data.jobs.length + " matches shown";
    var list = $("list"); list.replaceChildren();
    if (!rows.length) { list.appendChild(el("p", "note", "No matches at this minimum score. Lower the score or clear the search.")); return; }

    rows.forEach(function (j) {
      var item = el("article", "job");
      var b = band(j.score), sc = el("div", "score " + b[0]);
      sc.appendChild(el("b", "", String(j.score))); sc.appendChild(el("span", "", b[1]));
      var body = el("div"), h2 = el("h2"), url = safeUrl(j.url);
      if (url) { var a = el("a", "", j.title); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; h2.appendChild(a); }
      else h2.textContent = j.title;
      body.appendChild(h2);
      var meta = el("p", "meta");
      if (j.company) meta.appendChild(el("strong", "", j.company));
      if (j.location) meta.appendChild(document.createTextNode((j.company ? ", " : "") + j.location));
      body.appendChild(meta);
      if (j.reason) body.appendChild(el("p", "reason", j.reason));
      if (j.miles != null) body.appendChild(el("span", "tag", "about " + j.miles + " miles away"));
      if (j.remote) body.appendChild(el("span", "tag", "Remote"));
      if (j.salary) body.appendChild(el("span", "tag", j.salary));
      if (j.source) body.appendChild(el("span", "tag", j.source));
      item.appendChild(sc); item.appendChild(body); list.appendChild(item);
    });
  }

  $("q").addEventListener("input", function () { if (data) render(); });
  $("sort").addEventListener("change", function () { if (data) render(); });
  $("min").addEventListener("input", function () { $("minOut").textContent = $("min").value; if (data) render(); });
})();
</script>
</body>
</html>
